version: "3.9"

services:

  # ── JCBB Next.js App ──────────────────────────────────────────────────────
  web:
    image: ghcr.io/kvacanti95/jcbb-app:latest
    container_name: jcbb-web
    restart: unless-stopped
    ports:
      - "8080:3000"
    volumes:
      - jcbb-data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/jcbb.db
      - NEXTAUTH_URL=https://junctioncityboxingbrigade.com
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - COACH_EMAIL=${COACH_EMAIL}
      - COACH_PASSWORD=${COACH_PASSWORD}
    networks:
      - jcbb-net

  # ── Cloudflare Tunnel ─────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: jcbb-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - jcbb-net
    depends_on:
      - web

  # ── Watchtower (auto-pull new images) ────────────────────────────────────
  watchtower:
    image: containrrr/watchtower
    container_name: jcbb-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
    networks:
      - jcbb-net

networks:
  jcbb-net:
    driver: bridge

volumes:
  jcbb-data:
